version: 2
# Version-update PRs are turned off (open-pull-requests-limit set to 0) at the
# owner's request on 19/11/2026: dependencies are updated by hand on main.
# GitHub security alerts and the scheduled Dependency Audit workflow still run.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 0
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle non-major updates into a single PR to keep the review queue small.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci)"
