name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2

      - name: Scan source and lockfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: backend-source-sbom.spdx.json
          artifact-name: backend-source-sbom-${{ github.run_id }}.spdx.json

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit (advisory — does NOT block the push)
        # Non-blocking on purpose: a newly-published advisory in a transitive dep
        # must not block an unrelated code push. Enforcement lives elsewhere:
        #   • Dependabot opens fix PRs automatically (.github/dependabot.yml)
        #   • the weekly "Dependency Audit (scheduled)" workflow files a tracking issue
        # Keep this advisory signal bounded so registry latency cannot cancel the
        # whole CI run and block an otherwise valid production deployment.
        run: timeout 180s npm audit --audit-level=high
        continue-on-error: true

  lint-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax

      - name: OpenAPI runtime contract check
        run: npm run openapi:check

      - name: OpenAPI artifact staleness check
        run: npm run openapi:stale

      - name: Module dependency boundary check
        run: npm run architecture:check

      - name: Lint
        run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # src/config/jwt.js throws at require-time if these are unset — several
      # unit-test files pull it in transitively (auth middleware, authService
      # tokens, jwt config itself) even though none of them touch a real DB.
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        # Jest specs under tests/ use tests/helpers/mockPool.js — no real DB needed here.
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release package
        run: npm run build:release

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weavecarbon
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 4100
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: weavecarbon
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      FRONTEND_URLS: http://localhost:3000
      AUTH_PUBLIC_BASE_URL: http://localhost:4100
      CORS_ORIGIN: http://localhost:3000
      VNPAY_MODE: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure psql client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y postgresql-client
          fi

      - name: Load base database schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d weavecarbon -v ON_ERROR_STOP=1 -f DATABASE_SCHEMA.sql

      - name: Seed pre-WP-CARB5 legacy snapshot fixture
        env:
          ALLOW_MIGRATION_TEST_FIXTURE: "1"
        run: node scripts/seed-wp-carb5-legacy-fixture.js

      - name: Run migrations
        run: npm run migrate

      - name: Verify immutable calculation snapshot migration
        run: npm run test:migration-snapshots

      - name: Verify M1 tenant and factor-registry integrity
        run: npm run test:m1-integrity

      - name: Verify M4 durable queue recovery and dead-job retention
        run: npm run test:m4-operations

      - name: Audit representative hot-query plans
        run: npm run db:audit-hot-queries

      - name: Run isolated PostgreSQL and evidence restore drill
        run: bash scripts/backup-restore-drill.sh

      - name: Upload WP-S1 restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s1-backup-restore-${{ github.run_id }}
          path: artifacts/wp-s1/
          if-no-files-found: error
          retention-days: 14

      - name: Start API server
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4100/ready > /dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          cat server.log
          exit 1

      - name: Run API integration tests
        shell: bash
        run: |
          set +e
          node scripts/test-api.js http://localhost:4100 2>&1 | tee api-integration.log
          test_status="${PIPESTATUS[0]}"
          set -e
          {
            echo '### API integration test output'
            echo
            echo '<details><summary>Full result</summary>'
            echo
            echo '```text'
            cat api-integration.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$test_status" != '0' ]]; then
            failure_summary="$(grep '^FAILURE_SUMMARY_JSON=' api-integration.log | tail -n 1 || true)"
            failure_summary="${failure_summary//'%'/'%25'}"
            failure_summary="${failure_summary//$'\r'/'%0D'}"
            failure_summary="${failure_summary//$'\n'/'%0A'}"
            echo "::error title=API integration failure details::${failure_summary:-No structured failure summary was produced.}"
          fi
          exit "$test_status"

      - name: Show server log on failure
        if: failure()
        run: cat server.log || true

      - name: Stop API server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
