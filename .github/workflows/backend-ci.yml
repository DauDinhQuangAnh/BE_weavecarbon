name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: backend-ci-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weavecarbon
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 4100
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: weavecarbon
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      FRONTEND_URLS: http://localhost:3000
      AUTH_PUBLIC_BASE_URL: http://localhost:4100
      CORS_ORIGIN: http://localhost:3000
      VNPAY_MODE: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit (high/critical fails the build)
        run: npm audit --audit-level=high

      - name: Syntax check
        run: npm run check:syntax

      - name: Unit tests
        run: npm test

      - name: Ensure psql client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y postgresql-client
          fi

      - name: Load base database schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d weavecarbon -v ON_ERROR_STOP=1 -f DATABASE_SCHEMA.sql

      - name: Run migrations
        run: npm run migrate

      - name: Start API server
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4100/health > /dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          cat server.log
          exit 1

      - name: Run API integration tests
        run: node scripts/test-api.js http://localhost:4100

      - name: Show server log on failure
        if: failure()
        run: cat server.log || true

      - name: Stop API server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Build release package
        run: npm run build:release
